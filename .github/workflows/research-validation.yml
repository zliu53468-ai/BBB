name: Research Posterior And Runtime Bias Audit
on:
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - "final_probability_runtime.js"
      - "test_direction_bias_audit.js"
      - ".github/workflows/research-validation.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "final_probability_runtime.js"
      - "test_direction_bias_audit.js"
      - ".github/workflows/research-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only smoke-test dependencies (no retraining)
        run: python -m pip install 'numpy>=1.26,<3' 'numba>=0.60'
      - name: Research simulation rules, composition probability, posterior leakage
        run: python -m unittest discover -s research/tests -v
      - name: PR56 production contract (later EV-led diagnostics are archived)
        run: |
          node --check final_probability_runtime.js
          node --require ./legacy_profile_fixture.cjs test_pr56_restore.js
