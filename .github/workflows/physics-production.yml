name: Build Physics 57D Production Models

on:
  push:
    branches:
      - main
      - feature/direct-global-probability-xgb
      - "retrain-*"
    paths:
      - "physics_feature_extractor.py"
      - "particle_shoe_filter.py"
      - "particle_filter_runtime.js"
      - "xgb_final_probability.py"
      - "build_synthetic_residual_rows.js"
      - "final_probability_runtime.js"
      - "test_physics_feature_extractor.py"
      - "test_final_probability.py"
      - "test_final_probability_runtime.js"
      - "requirements-xgb.txt"
      - ".github/workflows/physics-production.yml"
  pull_request:
    branches:
      - main
    paths:
      - "physics_feature_extractor.py"
      - "particle_shoe_filter.py"
      - "particle_filter_runtime.js"
      - "xgb_final_probability.py"
      - "build_synthetic_residual_rows.js"
      - "final_probability_runtime.js"
      - "test_physics_feature_extractor.py"
      - "test_final_probability.py"
      - "test_final_probability_runtime.js"
      - "requirements-xgb.txt"
      - ".github/workflows/physics-production.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: physics-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-xgb.txt

      - name: Python unit tests
        run: python -m unittest -v test_physics_feature_extractor.py test_final_probability.py

      - name: Browser runtime preflight
        run: |
          node --check final_probability_runtime.js
          node test_final_probability_runtime.js

      - name: Train browser physics multi-task model
        run: |
          python physics_feature_extractor.py train \
            --shoes 2500 \
            --cut-cards 60 \
            --output physics_multitask_model.joblib \
            --browser-output physics_multitask_model.json

      - name: Generate independent synthetic binary-label dataset
        run: |
          python physics_feature_extractor.py simulate \
            --shoes 1000 \
            --cut-cards 60 \
          --output /tmp/physics_final_sim.npz \
          --rows-output /tmp/physics_final_rows.json
          node build_synthetic_residual_rows.js \
            /tmp/physics_final_rows.json \
            /tmp/physics_core_rows.json

      - name: Train 57D XGBoost final probability
        run: |
          python xgb_final_probability.py train \
            --input /tmp/physics_core_rows.json \
            --physics-model physics_multitask_model.joblib \
            --output final_probability_model.json \
            --min-samples 12000 \
            --min-shoes 1000 \
            --ci-smoke \
            --probability-bounds 0.40 0.60

      - name: Browser production smoke test
        run: BGS_USE_GENERATED_MODEL=1 node test_final_probability_runtime.js

      - name: Show model sizes
        run: |
          ls -lh physics_multitask_model.json final_probability_model.json physics_multitask_model.joblib

      - name: Commit generated production models
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'feature/direct-global-probability-xgb')
        run: |
          PROMOTE=$(python -c 'import json; m=json.load(open("final_probability_model.json",encoding="utf-8")); print("yes" if m.get("training",{}).get("metrics",{}).get("retraining_success") else "no")')
          if [ "$PROMOTE" != "yes" ]; then
            echo "Retraining success gate not met; smoke artifacts will not be promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add physics_multitask_model.json final_probability_model.json physics_multitask_model.joblib
          if git diff --cached --quiet; then
            echo "No generated model changes"
          else
            git commit -m "Build 56D final-probability model bundle [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
