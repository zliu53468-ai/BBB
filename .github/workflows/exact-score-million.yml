name: Exact single-score exhaustive and million-case validation
on:
  pull_request:
    branches: [main]
    paths: ["exact_score_*.js", "tools/exact_score/**", "validation/exact_score_million_summary.json", "test_exact_score_runtime.js", "point_signal_quality_guard.js", "quant256_online_panel.js", ".github/workflows/exact-score-million.yml"]
  push:
    branches: [main]
    paths: ["exact_score_*.js", "tools/exact_score/**", "validation/exact_score_million_summary.json", "test_exact_score_runtime.js", "point_signal_quality_guard.js", "quant256_online_panel.js", ".github/workflows/exact-score-million.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-million:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exhaustive current and next hand marginalization
        shell: pwsh
        run: ./tools/exact_score/build.ps1
      - run: python tools/exact_score/package_table.py
      - run: node tools/exact_score/compare_legacy.js
      - name: One million independent prequential synthetic cases
        shell: pwsh
        run: ./tools/exact_score/validate_million.ps1
      - run: python tools/exact_score/report.py
      - run: node test_exact_score_runtime.js && node test_v23_point_ui.js
      - uses: actions/upload-artifact@v4
        with:
          name: exact-score-million-validation
          path: |
            validation/exact_score_million_summary.json
            tools/exact_score/million_results.tsv
            tools/exact_score/million_results.tsv.cases.bin
