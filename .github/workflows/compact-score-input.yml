name: PR56 預測回復與精簡版面檢查
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bpt-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_pr56_restore.js
      - run: node --check auth-client.js && node --check particle_filter_runtime.js
      - run: node test_bbb_button_only.js
      - run: node test_bbb_result_persistence.js
