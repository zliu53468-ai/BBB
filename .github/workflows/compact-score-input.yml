name: Compact mobile score entry regression
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "auth-client.js"
      - "point_input_mode.js"
      - "particle_filter_runtime.js"
      - "final_probability_runtime.js"
      - "cardcount_profile.json"
      - "test_compact_point_input.js"
      - "test_pf_points_update.js"
      - "test_point_conditioned_runtime.js"
      - ".github/workflows/compact-score-input.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "auth-client.js"
      - "point_input_mode.js"
      - "particle_filter_runtime.js"
      - "final_probability_runtime.js"
      - "cardcount_profile.json"
      - "test_compact_point_input.js"
      - "test_pf_points_update.js"
      - "test_point_conditioned_runtime.js"
      - ".github/workflows/compact-score-input.yml"
permissions:
  contents: read
jobs:
  score-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check point_input_mode.js && node --check auth-client.js
      - run: node test_compact_point_input.js
      - run: node test_bbb_button_only.js
      - run: node test_pf_per_hand_update.js
      - run: node --check particle_filter_runtime.js && node test_pf_points_update.js
      - run: node test_point_conditioned_runtime.js
