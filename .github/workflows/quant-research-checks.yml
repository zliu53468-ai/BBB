name: BBB Quantitative Research Landing Checks
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "quant-research.css"
      - "bq-studio.css"
      - "bq-studio.js"
      - "test_bq_studio.mjs"
      - "partner-entry.html"
      - "partner-entry.css"
      - "test_quant_trial_portal.mjs"
      - "quant-research.js"
      - "quant-site.css"
      - "quant-site.js"
      - "quant-tools.html"
      - "research-hub.html"
      - "model-methodology.html"
      - "risk-center.html"
      - "test_quant_multipage.mjs"
      - "quant-guides.css"
      - "research/*.mjs"
      - "research-*.html"
      - "sitemap.xml"
      - "test_quant_guides.mjs"
      - "test_quant_research.mjs"
      - ".github/workflows/quant-research-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "quant-research.css"
      - "bq-studio.css"
      - "bq-studio.js"
      - "test_bq_studio.mjs"
      - "partner-entry.html"
      - "partner-entry.css"
      - "test_quant_trial_portal.mjs"
      - "quant-research.js"
      - "quant-site.css"
      - "quant-site.js"
      - "quant-tools.html"
      - "research-hub.html"
      - "model-methodology.html"
      - "risk-center.html"
      - "test_quant_multipage.mjs"
      - "test_quant_research.mjs"
      - ".github/workflows/quant-research-checks.yml"
permissions:
  contents: read
jobs:
  quant-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate native JavaScript
        run: node --check quant-research.js && node --check test_quant_research.mjs && node --check test_quant_guides.mjs && node --check research/martingale-100k.mjs && node --check quant-site.js && node --check test_quant_multipage.mjs && node --check test_quant_trial_portal.mjs && node --check bq-studio.js && node --check test_bq_studio.mjs
      - name: Run quantitative and SEO regression checks
        run: node test_quant_research.mjs && node test_quant_guides.mjs && node test_quant_multipage.mjs && node test_quant_trial_portal.mjs && node test_bq_studio.mjs
      - name: Preserve core application and existing SEO
        run: |
          node test_three_tab_ui.mjs
          node test_visitor_flow.mjs
          node test_seo_topic_cluster.mjs
