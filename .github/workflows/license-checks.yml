name: BBB License Gate Checks
on:
  push:
    branches: [main]
    paths:
      - 'license-worker/**'
      - 'auth-client.js'
      - 'bbb-license-storage.js'
      - 'bbb-screenshot-road.js'
      - 'bbb-desktop-capture.js'
      - 'test_bbb_desktop_capture.mjs'
      - 'test_bbb_screenshot_road.mjs'
      - 'test_license_storage.mjs'
      - 'auth-config.js'
      - 'activation-admin.js'
      - 'activation-admin.html'
      - 'index.html'
      - '.github/workflows/license-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'license-worker/**'
      - 'auth-client.js'
      - 'bbb-license-storage.js'
      - 'bbb-screenshot-road.js'
      - 'bbb-desktop-capture.js'
      - 'test_bbb_desktop_capture.mjs'
      - 'test_bbb_screenshot_road.mjs'
      - 'test_license_storage.mjs'
      - 'auth-config.js'
      - 'activation-admin.js'
      - 'activation-admin.html'
      - 'index.html'
      - '.github/workflows/license-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check auth-client.js && node --check bbb-license-storage.js && node --check auth-config.js && node --check activation-admin.js && node --check license-worker/src/index.js
      - run: node license-worker/test-license.mjs
      - run: node test_license_storage.mjs
      - run: node --check bbb-screenshot-road.js && node test_bbb_screenshot_road.mjs
      - run: node --check bbb-desktop-capture.js && node test_bbb_desktop_capture.mjs
