name: Quant256 experimental integration checks
on:
  push:
    branches: [main]
    paths:
      - "quant256_runtime.js"
      - "quant256_panel.js"
      - "app256.js"
      - "app256forward.js"
      - "auth-client.js"
      - "test_quant256.js"
      - ".github/workflows/quant256-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant256_runtime.js"
      - "quant256_panel.js"
      - "app256.js"
      - "app256forward.js"
      - "auth-client.js"
      - "test_quant256.js"
      - ".github/workflows/quant256-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quant-256:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check bayes_markov_runtime.js && node --check app256.js && node --check app256forward.js && node --check quant256_runtime.js && node --check quant256_panel.js && node --check test_quant256.js
      - run: node test_quant256.js
      - run: node experimental/quant_engine/test_engine.cjs
      - run: node --require ./legacy_profile_fixture.cjs test_bayes_markov_final.js
