name: 算牌機率方向與輔助權限檢查
on:
  push:
    branches: [main, codex/physics-forecast-first]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check final_probability_runtime.js && node --check auth-client.js
      - run: node --require ./legacy_profile_fixture.cjs test_pf_primary.js && node --require ./legacy_profile_fixture.cjs test_pf_primary_runtime.js && node --require ./legacy_profile_fixture.cjs test_pf_primary_rollback.js
      - run: node --require ./legacy_profile_fixture.cjs test_point_card_sampling.js && node --require ./legacy_profile_fixture.cjs test_point_card_rollback.js
      - run: node --require ./legacy_profile_fixture.cjs test_physics_forecast_first.js
      - run: node --require ./legacy_profile_fixture.cjs test_final_probability_runtime.js
      - run: node --require ./legacy_profile_fixture.cjs test_macro_runtime.js
      - run: node --require ./legacy_profile_fixture.cjs test_bbb_button_only.js
      - run: node --require ./legacy_profile_fixture.cjs test_cardcount_profile.js
      - run: node --check browser_calibration.js && node --require ./legacy_profile_fixture.cjs test_browser_calibration.js

      - run: node --require ./legacy_profile_fixture.cjs test_middle_late_upgrade.js
      - name: Production Physics/PF ownership and EV guard release contract
        run: node --check test_physics_pf_primary_release.js && node test_physics_pf_primary_release.js
