name: 算牌機率方向與輔助權限檢查
on:
  push:
    branches: [main, codex/physics-forecast-first]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check final_probability_runtime.js && node --check auth-client.js
      - run: node test_physics_forecast_first.js
      - run: node test_final_probability_runtime.js
      - run: node test_macro_runtime.js
      - run: node test_bbb_button_only.js
      - run: node test_cardcount_profile.js
      - run: node --check browser_calibration.js && node test_browser_calibration.js

      - run: node test_middle_late_upgrade.js
      - run: node test_post_draw_ev.js
      - run: node test_pf_per_hand_update.js
      - run: node test_first_layer_smoothing.js
      - run: node test_winrate_priority_v1.js
      - run: node test_selective_entry_v2.js
      - run: node test_first_layer_ev.js
      - run: node test_prequential_ev.js
      - run: node test_pr59_prediction_baseline.js
      - run: node test_ev_led_direction.js
      - run: python -m unittest -v test_post_draw_report
