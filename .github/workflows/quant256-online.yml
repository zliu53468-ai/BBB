name: Quant256 Online Decay & Guard Checks
on:
  push:
    branches: [main]
    paths: ["quant256_online_*.js", "test_quant256_online.js", "test_v2_mc_seed_isolation.js", "test_v2_pf96_weighted.js", "test_v2_pf96_l256_m96.js", "test_v2_pf192_l256_m128.js", "test_v2_pf256_l384_m160.js", "test_v2_early_shoe_guard.js", "test_v26_early_shoe_independent.js", "test_v26_100_scores.js", "test_v26_mild_quality_skip.js", "point_signal_quality_guard.js", "test_v2_1_rb_rejuvenation.js", "test_markov_residual_v22.js", "test_v23_point_conditioned.js", "test_v23_point_ui.js", "test_v24_independent_points.js", "test_v2_dynamic_distribution_guard.js", "shoe_distribution_guard.js", "quant256_bankroll_ui.js", "test_v3_bankroll_ui.js", "styles.css", "viewport-fit.js", "test_fixed_view_ui.js", "markov_residual_runtime.js", "physics_forecast_first_runtime.js", "test_physics_forecast_first.js", "auth-client.js", "index.html", ".github/workflows/quant256-online.yml"]
  pull_request:
    branches: [main]
    paths: ["quant256_online_*.js", "test_quant256_online.js", "test_v2_mc_seed_isolation.js", "test_v2_pf96_weighted.js", "test_v2_pf96_l256_m96.js", "test_v2_pf192_l256_m128.js", "test_v2_pf256_l384_m160.js", "test_v2_early_shoe_guard.js", "test_v26_early_shoe_independent.js", "test_v26_100_scores.js", "test_markov_residual_v22.js", "test_v23_point_conditioned.js", "test_v23_point_ui.js", "test_v24_independent_points.js", "test_v2_dynamic_distribution_guard.js", "shoe_distribution_guard.js", "quant256_bankroll_ui.js", "test_v3_bankroll_ui.js", "styles.css", "viewport-fit.js", "test_fixed_view_ui.js", "markov_residual_runtime.js", "physics_forecast_first_runtime.js", "test_physics_forecast_first.js", "auth-client.js", "index.html", ".github/workflows/quant256-online.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-quant256:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check shoe_distribution_guard.js && node --check test_v2_dynamic_distribution_guard.js && node --check test_v2_early_shoe_guard.js && node --check test_v26_early_shoe_independent.js && node --check test_v26_100_scores.js && node --check point_signal_quality_guard.js && node --check test_v26_mild_quality_skip.js && node --check viewport-fit.js && node --check test_fixed_view_ui.js && node --check test_v2_pf96_l256_m96.js && node --check test_v2_pf192_l256_m128.js && node --check test_v2_pf256_l384_m160.js && node --check test_v2_1_rb_rejuvenation.js && node --check test_markov_residual_v22.js && node --check test_v23_point_conditioned.js && node --check test_v23_point_ui.js && node --check test_v24_independent_points.js && node --check test_v2_pf96_weighted.js && node --check test_v2_mc_seed_isolation.js && node --check quant256_online_runtime.js && node --check quant256_bankroll_ui.js && node --check test_v3_bankroll_ui.js && node --check quant256_online_panel.js && node --check markov_residual_runtime.js && node --check physics_forecast_first_runtime.js && node --check test_physics_forecast_first.js && node --check test_quant256_online.js && node --check auth-client.js
      - name: Online model and interface regression
        run: node test_exact_single_score.js && node test_quant256_online.js && node test_physics_forecast_first.js && node test_v2_mc_seed_isolation.js && node test_v2_1_rb_rejuvenation.js && node test_markov_residual_v22.js && node test_v23_point_conditioned.js && node test_v23_point_ui.js && node test_v24_independent_points.js && node test_v2_pf96_weighted.js && node test_v2_pf96_l256_m96.js && node test_v2_pf192_l256_m128.js && node test_v2_pf256_l384_m160.js && node test_v2_early_shoe_guard.js && node test_v26_early_shoe_independent.js && node test_v26_mild_quality_skip.js && node test_v2_dynamic_distribution_guard.js && node test_v3_bankroll_ui.js && node test_fixed_view_ui.js
      - name: Live loader checks
        run: |
          node -e 'const fs=require("fs");const a=fs.readFileSync("auth-client.js","utf8");for(const f of ["quant256_online_runtime.js","shoe_distribution_guard.js","markov_residual_runtime.js", "physics_forecast_first_runtime.js","point_signal_quality_guard.js","quant256_online_panel.js","quant256_bankroll_ui.js"])if(!a.includes(f))throw Error("missing script "+f);const i=fs.readFileSync("index.html","utf8");if(!i.includes("20261104-visible-gate-v4"))throw Error("stale page cache key");console.log("PASS browser loader references")'

  independent-score-100-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: All 100 final score pairs with PF96 and two-hand length joint
        run: node test_v26_100_scores.js
