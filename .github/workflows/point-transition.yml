name: Persistent total-point transitions and adaptive observation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  point-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check point_transition_runtime.js && node --check point_transition_panel.js
      - run: node test_point_transitions.js && node test_point_transition_panel.js
      - run: node test_license_storage.mjs && node test_end_analysis_reload.js
