name: 不觀望命中率驗證工具檢查
on:
  push:
    branches: [main]
    paths: ['tools/no_skip_validation.js', 'tools/no_skip_parameter_search.js', 'tools/fit_no_skip_calibrator.py', 'tools/no_skip_calibration_candidate.js', 'test_no_skip_calibration_candidate.js', 'test_fit_no_skip_calibrator.py', 'requirements-no-skip-calibration.txt', 'validation/no_skip_calibration_holdout.json', 'candidates/no_skip_calibrator_v1.json', 'test_no_skip_parameter_search.js', 'NO_SKIP_PARAMETER_SEARCH.md', 'validation/no_skip_search_summary.json', 'test_no_skip_validation.js', 'NO_SKIP_VALIDATION.md', 'validation/no_skip_independent_summary.json', '.github/workflows/no-skip-validation.yml']
  pull_request:
    branches: [main]
    paths: ['tools/no_skip_validation.js', 'tools/no_skip_parameter_search.js', 'tools/fit_no_skip_calibrator.py', 'tools/no_skip_calibration_candidate.js', 'test_no_skip_calibration_candidate.js', 'test_fit_no_skip_calibrator.py', 'requirements-no-skip-calibration.txt', 'validation/no_skip_calibration_holdout.json', 'candidates/no_skip_calibrator_v1.json', 'test_no_skip_parameter_search.js', 'NO_SKIP_PARAMETER_SEARCH.md', 'validation/no_skip_search_summary.json', 'test_no_skip_validation.js', 'NO_SKIP_VALIDATION.md', 'validation/no_skip_independent_summary.json', '.github/workflows/no-skip-validation.yml']
permissions:
  contents: read
jobs:
  audit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-no-skip-calibration.txt
      - run: python -m unittest test_fit_no_skip_calibrator
      - run: node --require ./legacy_profile_fixture.cjs test_no_skip_calibration_candidate.js
      - run: node --check tools/no_skip_validation.js
      - run: node --require ./legacy_profile_fixture.cjs test_no_skip_validation.js
      - run: node --check tools/no_skip_parameter_search.js
      - run: node --require ./legacy_profile_fixture.cjs test_no_skip_parameter_search.js
