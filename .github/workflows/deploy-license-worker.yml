name: Deploy BBB Cloudflare License Worker
on:
  push:
    branches: [main]
    paths:
      - "license-worker/**"
      - "trial-client.js"
      - ".github/workflows/deploy-license-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report Cloudflare deployment credentials
        id: access
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped: set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "Cloudflare deployment skipped because required secrets are absent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply pending production D1 migrations before Worker upgrade
        if: steps.access.outputs.ready == 'yes'
        working-directory: license-worker
        run: npx --yes wrangler@4 d1 migrations apply bbb-license-db --remote
      - name: Deploy licensed Worker while retaining existing Worker secrets
        if: steps.access.outputs.ready == 'yes'
        working-directory: license-worker
        run: npx --yes wrangler@4 deploy
      - name: Verify trial-version health endpoint
        if: steps.access.outputs.ready == 'yes'
        shell: bash
        run: |
          sleep 3
          curl --fail --silent --show-error --max-time 20 \
            "https://bbb-license-gateway.zliu53468.workers.dev/health" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);if(j.trial_api_version!==1||j.configured!==true){console.error("Cloudflare trial API did not upgrade or secrets are missing");process.exit(1)}console.log("Cloudflare trial routes deployed successfully")})'
