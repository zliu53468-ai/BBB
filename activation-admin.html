<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>莊家剋星 · 開通碼管理</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0717;color:#f8f4ff;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}
main{width:min(1060px,calc(100% - 28px));margin:35px auto}h1{font-size:27px;margin-bottom:5px}p{color:#b5a8cf;line-height:1.55}
section{background:#19112b;border:1px solid #44335e;border-radius:15px;padding:18px;margin-top:18px}
label{font-size:13px;color:#d5c4f5;display:block;margin:9px 0 5px}
input,button{font:inherit;border-radius:9px;padding:11px}input{width:100%;border:1px solid #6a547d;color:#fff;background:#100c20}
button{background:#7c50d5;border:0;color:white;cursor:pointer;font-weight:700;margin:6px 5px 4px 0}
button:disabled{opacity:.5}button.secondary{background:#483563}button.danger{background:#9a3556}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9c5ff;font:13px/1.7 monospace}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #45345d;text-align:left;word-break:break-word}
th{color:#bba4e9}.scroll{overflow-x:auto}#note{min-height:20px;color:#caaeff}.code-output{background:#0c0917;padding:13px;border-radius:9px}
</style>
</head>
<body>
<main>
<h1>莊家剋星 · 程式開通碼管理</h1>
<p>產生開通碼、查看綁定狀態、重置裝置或撤銷授權。管理金鑰只用於本次請求，不保存在瀏覽器中。</p>
<section>
<label for="adminToken">管理者 API 金鑰（Worker ADMIN_TOKEN）</label>
<input id="adminToken" type="password" autocomplete="off" placeholder="請輸入伺服器設定的 ADMIN_TOKEN">
<p>這不是會員開通碼。請勿將管理者金鑰發給使用者。</p>
</section>
<section>
<h2>產生程式開通碼</h2>
<div class="controls">
<div><label for="count">產生組數（1～30）</label><input id="count" type="number" min="1" max="30" value="1"></div>
<div><label for="label">標籤／會員備註</label><input id="label" placeholder="例如：會員 A"></div>
<div><label for="expiresAt">到期日期（留空表示無期限）</label><input id="expiresAt" type="date"></div>
</div>
<button id="create">產生開通碼</button><button id="refresh" class="secondary">重新讀取狀態</button>
<div id="note" role="status"></div>
<pre class="code-output" id="created">開通碼僅在產生當下顯示一次，請立即妥善保存。</pre>
</section>
<section>
<h2>開通碼清單</h2>
<div class="scroll"><table><thead><tr><th>標籤</th><th>尾碼</th><th>狀態</th><th>綁定時間</th><th>到期時間</th><th>操作</th></tr></thead><tbody id="records"><tr><td colspan="6">輸入管理金鑰後按「重新讀取狀態」。</td></tr></tbody></table></div>
</section>
<p><a href="index.html" style="color:#b996ff">返回程式登入畫面</a></p>
</main>
<script src="auth-config.js?v=20261011-prod-gateway"></script><script src="activation-admin.js?v=20261011-prod-gateway"></script>
</body></html>
