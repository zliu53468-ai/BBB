<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090716"><title>授權需要續期或協助｜莊家剋星</title><link rel="stylesheet" href="/site-funnel.css?v=20261114-v1">
<style>.expire{min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:560px;text-align:center;padding:36px;border:1px solid #453963;border-radius:24px;background:linear-gradient(145deg,#19142c,#0e0c18);box-shadow:0 20px 80px #0008}.orbit{width:104px;height:104px;margin:0 auto 22px;border:2px solid #a68cff;border-radius:50%;display:grid;place-items:center;animation:spin 7s linear infinite;box-shadow:0 0 32px #9a71ff55}.orbit span{animation:spin 7s linear infinite reverse;font-size:2.4rem;color:#d8c7ff}@keyframes spin{to{transform:rotate(360deg)}}.count{font-variant-numeric:tabular-nums}@media(prefers-reduced-motion:reduce){.orbit,.orbit span{animation:none}}</style></head>
<body><main class="expire"><section class="box"><div class="orbit" aria-hidden="true"><span>✦</span></div><p class="eyebrow">BANKER SLAYER SUPPORT</p><h1>授權需要續期或協助</h1><p>這組裝置授權目前無法通過驗證。請聯絡莊家剋星官方 LINE 查詢到期、停用或重新開通事宜。</p><p class="count"><span id="countdown">4</span> 秒後前往官方 LINE</p><div class="actions" style="justify-content:center"><a class="button" href="https://lin.ee/VmBTMW6" rel="noopener noreferrer">立即前往官方 LINE</a><a id="homeLink" class="button secondary" href="/">返回首頁</a></div><p class="note">若未自動跳轉，請點上方按鈕。跳轉只會前往官方客服連結。</p></section></main>
<script>(()=>{let n=4;const el=document.getElementById("countdown"),home=document.getElementById("homeLink");const timer=setInterval(()=>{n-=1;el.textContent=String(Math.max(0,n));if(n<=0)location.replace("https://lin.ee/VmBTMW6");},1000);home.addEventListener("click",()=>clearInterval(timer));})();</script></body></html>
