<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>BGS AI 預測分析</title>
  <meta name="description" content="BGS 256維 Frozen Direct 柱高分析面板">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">BGS</div>
        <div>
          <h1>AI 預測分析</h1>
          <p>256維穩定分析核心</p>
        </div>
      </div>
      <div class="status-area">
        <span class="status-pill" id="modePill">準備中</span>
        <span class="round-pill" id="roundPill">0 局</span>
      </div>
    </header>

    <section class="card prediction-card">
      <div class="card-title"><span>下一局方向</span><small>即時分析</small></div>
      <div class="prediction-layout">
        <div class="direction-orb idle" id="directionOrb"><span id="directionText">—</span><small id="directionCode">等待分析</small></div>
        <div class="metrics">
          <div class="metric"><span>模型信心</span><strong id="confidence">—</strong></div>
          <div class="metric"><span>牌型狀態</span><strong id="regime">—</strong></div>
          <div class="metric"><span>結構強度</span><strong id="strength">—</strong></div>
          <div class="metric"><span>分析局數</span><strong><b id="roundCount">0</b> 局</strong></div>
        </div>
      </div>
      <div class="message" id="message" aria-live="polite">輸入牌局後開始分析</div>
    </section>

    <section class="card controls-card">
      <div class="result-buttons">
        <button class="result-btn banker" id="btnB" type="button"><strong>莊</strong><small>BANKER</small></button>
        <button class="result-btn player" id="btnP" type="button"><strong>閒</strong><small>PLAYER</small></button>
        <button class="result-btn tie" id="btnT" type="button"><strong>和</strong><small>TIE</small></button>
      </div>
      <div class="action-buttons">
        <button class="action-btn primary" id="btnStart" type="button">開始分析</button>
        <button class="action-btn" id="btnBack" type="button">返回上一局</button>
        <button class="action-btn danger" id="btnEnd" type="button">結束分析</button>
      </div>
      <div class="clear-note">結束分析會清空本靴全部紀錄</div>
    </section>

    <section class="card history-card">
      <div class="card-title"><span>本靴紀錄</span><small>依輸入順序排列</small></div>
      <div class="history-track" id="historyTrack"><div class="empty-history">尚未輸入牌局</div></div>
    </section>

    <footer>256維 Frozen Direct 柱高版 · 網頁測試面板</footer>
  </main>

  <script src="app256.js"></script>
</body>
</html>
