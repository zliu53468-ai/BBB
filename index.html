<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090716">
  <title>莊家剋星AI百家程式</title>
  <meta name="description" content="莊家剋星AI百家程式｜即時牌路分析面板">
  <link rel="stylesheet" href="styles.css?v=14.8-macro-ema">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="mark-glow"></span>
          <img src="assets/logo-baccarat-slayer.webp" alt="">
        </div>
        <div class="brand-copy">
          <p class="eyebrow">BANKER SLAYER · AI ANALYSIS</p>
          <h1>莊家剋星AI百家程式</h1>
          <p class="brand-subtitle">即時牌路分析・智慧決策輔助</p>
        </div>
      </div>
      <div class="status-area">
        <span class="status-pill"><i></i><span id="modePill">準備中</span></span>
        <span class="round-pill" id="roundPill">0 局</span>
      </div>
    </header>

    <section class="brand-hero" aria-label="莊家剋星AI百家程式主視覺">
      <img class="hero-art" src="assets/hero-baccarat-slayer.webp" alt="莊家剋星AI百家程式主視覺">
      <div class="hero-vignette" aria-hidden="true"></div>
      <div class="hero-scan" aria-hidden="true"></div>
      <div class="hero-particles" aria-hidden="true"></div>
      <div class="hero-content">
        <img class="hero-logo" src="assets/logo-baccarat-slayer.webp" alt="莊家剋星AI百家程式">
        <p>INTELLIGENT BACCARAT ANALYSIS</p>
      </div>
    </section>

    <section class="card prediction-card">
      <div class="card-title"><span>下一局方向</span><small>LIVE ANALYSIS</small></div>
      <div class="prediction-layout">
        <div class="direction-orb idle" id="directionOrb"><span id="directionText">—</span><small id="directionCode">等待分析</small></div>
        <div class="metrics">
          <div class="metric"><span>模型信心</span><strong id="confidence">—</strong></div>
          <div class="metric"><span>牌型狀態</span><strong id="regime">—</strong></div>
          <div class="metric"><span>結構強度</span><strong id="strength">—</strong></div>
          <div class="metric"><span>分析局數</span><strong><b id="roundCount">0</b> 局</strong></div>
        </div>
      </div>
      <div class="message" id="message" aria-live="polite">輸入牌局後開始分析</div>
    </section>

    <section class="card controls-card">
      <details class="macro-inputs">
        <summary>本局張數與點數（選填）</summary>
        <p>先填寫已開牌的資料，再點莊／閒／和。未知請留空。</p>
        <div class="macro-fields">
          <label>總張數<select id="macroCardCount"><option value="">未知</option><option value="4">4 張</option><option value="5">5 張</option><option value="6">6 張</option></select></label>
          <label>閒點數<input id="macroPlayerScore" type="number" inputmode="numeric" min="0" max="9" step="1" placeholder="0–9"></label>
          <label>莊點數<input id="macroBankerScore" type="number" inputmode="numeric" min="0" max="9" step="1" placeholder="0–9"></label>
        </div>
      </details>
      <div class="result-buttons">
        <button class="result-btn banker" id="btnB" type="button"><strong>莊</strong><small>BANKER</small></button>
        <button class="result-btn player" id="btnP" type="button"><strong>閒</strong><small>PLAYER</small></button>
        <button class="result-btn tie" id="btnT" type="button"><strong>和</strong><small>TIE</small></button>
      </div>
      <div class="action-buttons">
        <button class="action-btn primary" id="btnStart" type="button">開始分析</button>
        <button class="action-btn" id="btnBack" type="button">返回上一局</button>
        <button class="action-btn danger" id="btnEnd" type="button">結束分析</button>
      </div>
      <div class="clear-note">結束分析會清空本靴全部紀錄</div>
    </section>

    <section class="card history-card">
      <div class="card-title"><span>本靴紀錄</span><small>依輸入順序排列</small></div>
      <div class="history-track" id="historyTrack"><div class="empty-history">尚未輸入牌局</div></div>
      <div class="export-buttons"><button class="action-btn" id="btnExportTraining" type="button">匯出分析紀錄</button><button class="action-btn" id="btnExportObservations" type="button">匯出開牌資料</button></div>
    </section>

    <footer>莊家剋星AI百家程式 · AI DECISION ASSISTANT</footer>
  </main>

  <script src="app256forward.js"></script>
  <script src="app256continuation.js"></script>
  <script src="particle_filter_runtime.js?v=1-fixed500-stateless"></script>
  <script src="macro_ema.js?v=1"></script>
  <script src="final_probability_runtime.js?v=14.8-macro-ema-guard"></script>
</body>
</html>
