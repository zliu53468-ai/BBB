<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#090716"><title>百家樂試玩面板｜莊家剋星</title><link rel="canonical" href="https://bgsv1.xyz/play/"><link rel="stylesheet" href="/site-funnel.css?v=20261114-v1"></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/">莊家剋星｜百家樂工具</a><nav class="navlinks"><a href="/guides/baccarat-trial/">使用說明</a><a href="/">首頁</a></nav></div></header>
<main class="wrap play-shell"><p class="eyebrow">TRIAL PANEL</p><h1>DG 試玩與莊閒紀錄面板</h1><p class="note">DG 遊戲由 DG 網站載入；方向圓圈同步顯示下方莊家剋星面板的狀態。請手動記錄每局結果。本頁不讀取 DG 畫面或自動同步外站資料。</p>
<div class="play-grid"><section class="frame-card" aria-label="DG 官方試玩"><div class="frame-head"><strong>DG 官方試玩頁</strong><a href="https://dg66.net/Opengame/freegame/" target="_blank" rel="noopener noreferrer">在 DG 開啟</a></div><div id="directionBadge" class="direction-badge" aria-live="polite">—<small>未分析</small></div>
<iframe id="dgFrame" src="https://dg66.net/Opengame/freegame/" title="DG 官方百家樂試玩頁" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe><p class="external-note">若 DG 不允許嵌入或要求外站驗證，請點「在 DG 開啟」並依其官方流程操作。</p></section>
<aside class="analysis-card"><h2>莊家剋星分析面板</h2><p class="note">輸入開通碼後，請手動記錄莊、閒或和。圓圈只鏡像本面板顯示的方向。</p><iframe id="appFrame" src="/app.html?embedded=1" title="莊家剋星手動輸入分析面板"></iframe></aside></div></main>
<footer class="footer"><div class="wrap"><a href="/">首頁</a> · <a href="/guides/baccarat-trial/">試玩與使用教學</a></div></footer>
<script>(()=>{"use strict";const appFrame=document.getElementById("appFrame"),badge=document.getElementById("directionBadge");
function setDirection(label){badge.classList.remove("banker","player");const text=String(label||"").trim();if(text==="莊"||text==="B"){badge.classList.add("banker");badge.innerHTML="莊<small>研究方向</small>";}else if(text==="閒"||text==="P"){badge.classList.add("player");badge.innerHTML="閒<small>研究方向</small>";}else{badge.innerHTML="—<small>"+(text==="觀望"||text==="SKIP"?"觀望":"未分析")+"</small>";}}
function connect(){try{const doc=appFrame.contentDocument;if(!doc)return;const direction=doc.getElementById("directionText"),orb=doc.getElementById("directionOrb"),gate=doc.getElementById("licenseGate");if(!direction)return;const update=()=>setDirection(gate&&!gate.hidden?"尚未開通":direction.textContent);update();new MutationObserver(update).observe(direction,{childList:true,characterData:true,subtree:true});if(orb)new MutationObserver(update).observe(orb,{attributes:true,attributeFilter:["class"]});if(gate)new MutationObserver(update).observe(gate,{attributes:true,attributeFilter:["hidden"]});}catch(_){setDirection("尚未分析");}}
appFrame.addEventListener("load",connect);window.addEventListener("message",event=>{if(event.origin===window.location.origin&&event.source===appFrame.contentWindow&&event.data?.type==="bbb-license-expired")window.location.assign("/expired/");});})();</script></body></html>
