name = "bbb-license-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Change database_id after `npx wrangler d1 create bbb-license-db`.
[[d1_databases]]
binding = "DB"
database_name = "bbb-license-db"
database_id = "e7578d99-8926-4e1c-bca5-4489662dbca1"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://bgsv1.xyz,https://www.bgsv1.xyz"

[triggers]
crons = ["0 3 * * *"]
